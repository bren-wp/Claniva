name: Native runtime launch smoke tests
on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.1'
      - name: Compile actual APK
        run: gradle -p android :app:assembleDebug --stacktrace --no-daemon
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator, launch Android twice and capture logs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/android_launch_smoke.sh
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-startup-evidence
          path: qa/runtime/android/
          if-no-files-found: warn
  windows-runtime:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish full and demo WinUI 3
        shell: pwsh
        run: |
          dotnet publish windows/Claniva/Claniva.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -o out\full
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish windows/Claniva/Claniva.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:DemoBuild=true -o out\demo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Start native full Windows window
        shell: pwsh
        run: ./scripts/windows_launch_smoke.ps1 -ApplicationPath "out/full/Clanarina.exe" -ArtifactName "FullWinUI"
      - name: Start native demo Windows window
        shell: pwsh
        run: ./scripts/windows_launch_smoke.ps1 -ApplicationPath "out/demo/ClanarinaDemo.exe" -ArtifactName "DemoWinUI"
      - name: Upload local Windows diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-startup-evidence
          path: qa/runtime/windows/
          if-no-files-found: warn
