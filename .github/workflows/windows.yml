name: Windows — WinUI build
on:
  push:
    branches: [main, feat/**]
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore windows/Claniva/Claniva.csproj
      - name: Build WinUI 3
        run: dotnet build windows/Claniva/Claniva.csproj --configuration Release --no-restore -p:Platform=x64
