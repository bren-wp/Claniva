name: Quality — brand, PHP, website
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
on:
  push:
    branches: [main, feat/**]
  pull_request:
jobs:
  brand-and-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify brand tokens and static links
        run: python3 scripts/check_assets.py
      - name: Verify native brand parity and full screen audit inventory
        run: |
          python3 scripts/brand_parity.py
          python3 -m pip install --disable-pip-version-check Pillow
          python3 scripts/visual_audit.py --validate-manifest
      - name: Verify exact pixel comparator rejects modified images
        run: |
          python3 scripts/test_visual_audit.py
      - name: Check demo isolation and required release artifacts
        run: python3 scripts/test_demo_rules.py
      - name: Test financial schema migration and debt/prepayment invariants
        run: python3 scripts/test_financial_contract.py
      - name: Enforce safe native WinUI bootstrap and source module layout
        run: python3 scripts/test_native_bootstrap.py
      - name: Verify design tokens, accessibility contrast and native visual parity
        run: python3 scripts/test_design_contract.py
      - name: Verify compact native dialog form contracts
        run: python3 scripts/test_ui_form_contract.py
  php-licensing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: find licensing -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: License signature and seat smoke tests
        run: php licensing/tests/smoke.php
