name: Release - APK AAB Portable Setup Source
on:
  push:
    branches: [main, "feat/**", "fix/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.1'
      - name: Configure signing
        shell: bash
        env:
          STORE_B64: ${{ secrets.CLANARINA_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.CLANARINA_ANDROID_STORE_PASS }}
          ALIAS: ${{ secrets.CLANARINA_ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.CLANARINA_ANDROID_KEY_PASS }}
        run: |
          set -euo pipefail
          umask 077
          store="$RUNNER_TEMP/clanarina.jks"
          if [[ -n "$STORE_B64" && -n "$STORE_PASS" && -n "$ALIAS" && -n "$KEY_PASS" ]]; then
            printf '%s' "$STORE_B64" | base64 -d > "$store"
            echo "SIGNING_TEST=false" >> "$GITHUB_ENV"
            echo "CLANARINA_ANDROID_STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
            echo "CLANARINA_ANDROID_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
            echo "CLANARINA_ANDROID_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -noprompt -keystore "$store" -alias development -keyalg RSA -keysize 3072 -validity 30 -storepass DevelopmentOnly123 -keypass DevelopmentOnly123 -dname "CN=Clanarina Test, O=BRENDIGO"
            echo "SIGNING_TEST=true" >> "$GITHUB_ENV"
            echo "CLANARINA_ANDROID_STORE_PASSWORD=DevelopmentOnly123" >> "$GITHUB_ENV"
            echo "CLANARINA_ANDROID_KEY_ALIAS=development" >> "$GITHUB_ENV"
            echo "CLANARINA_ANDROID_KEY_PASSWORD=DevelopmentOnly123" >> "$GITHUB_ENV"
          fi
          echo "CLANARINA_ANDROID_KEYSTORE=$store" >> "$GITHUB_ENV"
      - name: Build signed APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android :app:assembleRelease :app:bundleRelease --stacktrace --no-daemon "-PreleaseVersionName=0.2.$GITHUB_RUN_NUMBER-dev" "-PreleaseVersionCode=$GITHUB_RUN_NUMBER"
          apk=android/app/build/outputs/apk/release/app-release.apk
          aab=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$apk" && test -s "$aab"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
          jarsigner -verify "$aab"
          mkdir dist
          cp "$apk" dist/Clanarina-Android.apk
          cp "$aab" dist/Clanarina-Android.aab
          if [[ "$SIGNING_TEST" == "true" ]]; then
            echo "TEST KEY. NOT FOR GOOGLE PLAY. Each CI run has a different signing key. Configure permanent secrets." > dist/ANDROID-SIGNING-STATUS.txt
          else
            echo "Signed using GitHub Secrets key. Google Play publication requires separate policy and signing verification." > dist/ANDROID-SIGNING-STATUS.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained Windows app
        shell: pwsh
        run: |
          $pub = Join-Path $env:GITHUB_WORKSPACE 'out\publish'
          dotnet publish windows/Claniva/Claniva.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true -o "$pub"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "$pub\Clanarina.exe")) { throw 'No native executable' }
      - name: Publish separate licence-free Windows DEMO
        shell: pwsh
        run: |
          $pub = Join-Path $env:GITHUB_WORKSPACE 'out\demo'
          dotnet publish windows/Claniva/Claniva.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:DemoBuild=true -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true -o "$pub"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "$pub\ClanarinaDemo.exe")) { throw 'Missing DEMO executable' }
          if (Test-Path "$pub\Clanarina.exe") { throw 'DEMO output contains full app executable' }
      - name: Test actual Windows DEMO data generation
        shell: pwsh
        run: |
          dotnet run --project tests/ClanarinaDemoSmoke/ClanarinaDemoSmoke.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install NSIS modern installer toolchain
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build modern Setup and Portable executables
        shell: pwsh
        run: |
          $pub = Join-Path $env:GITHUB_WORKSPACE 'out\publish'
          $dest = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $nsis = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (!(Test-Path $nsis)) { $nsis = (Get-Command makensis.exe -ErrorAction Stop).Source }
          $defines = @("/V2", "/DPUBLISH_DIR=$pub", "/DOUTPUT_DIR=$dest", "/DVERSION=0.2.$env:GITHUB_RUN_NUMBER", "/DLICENSE_FILE=$env:GITHUB_WORKSPACE\LICENSE-COMMERCIAL.txt")
          & $nsis @defines "windows\installer\Clanarina.nsi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $nsis @defines "/DPORTABLE_BUILD" "windows\installer\Clanarina.nsi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $demoPub = Join-Path $env:GITHUB_WORKSPACE 'out\demo'
          $demoDefines = @("/V2", "/DPUBLISH_DIR=$demoPub", "/DOUTPUT_DIR=$dest", "/DVERSION=0.2.$env:GITHUB_RUN_NUMBER", "/DLICENSE_FILE=$env:GITHUB_WORKSPACE\LICENSE-COMMERCIAL.txt", "/DDEMO_BUILD")
          & $nsis @demoDefines "windows\installer\Clanarina.nsi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $nsis @demoDefines "/DPORTABLE_BUILD" "windows\installer\Clanarina.nsi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in @('Clanarina-Setup.exe','Clanarina-Portable.exe','Clanarina-Demo-Setup.exe','Clanarina-Demo-Portable.exe')) {
            $p = Join-Path $dest $name
            if (!(Test-Path $p) -or (Get-Item $p).Length -lt 100000) { throw "Missing or invalid: $name" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/*.exe
          if-no-files-found: error

  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and package all source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_assets.py
          php licensing/tests/smoke.php
          mkdir dist
          git archive --format=zip --output=dist/Clanarina-Full-Source.zip HEAD
          zip -q -r dist/Clanarina-Web-Source.zip site branding design LICENSE-COMMERCIAL.txt
          cp LICENSE-COMMERCIAL.txt dist/
          test -s dist/Clanarina-Full-Source.zip && test -s dist/Clanarina-Web-Source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: dist-source
          path: dist/*
          if-no-files-found: error

  android-launch:
    name: Install and launch signed APK on emulator
    needs: [android]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-android
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and open the exact release APK twice
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/android_launch_smoke.sh dist/Clanarina-Android.apk
      - name: Upload actual Android launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk-launch-evidence
          path: qa/runtime/android/
          if-no-files-found: warn

  windows-launch:
    name: Open installed and portable Windows Full + Demo
    needs: [windows]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-windows
          path: dist
      - name: Execute real Setup and Portable files in both editions
        shell: pwsh
        run: ./scripts/windows_package_launch_smoke.ps1 -Distribution dist
      - name: Upload package launch logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages-launch-evidence-${{ matrix.os }}
          path: |
            qa/runtime/windows/
            qa/runtime/windows-package/
          if-no-files-found: warn

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [android, windows, source, android-launch, windows-launch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'dist-*'
          path: release
          merge-multiple: true
      - name: Verify mandatory deliverables
        shell: bash
        run: |
          set -euo pipefail
          cd release
          for file in Clanarina-Android.apk Clanarina-Android.aab Clanarina-Setup.exe Clanarina-Portable.exe Clanarina-Demo-Setup.exe Clanarina-Demo-Portable.exe Clanarina-Full-Source.zip Clanarina-Web-Source.zip LICENSE-COMMERCIAL.txt; do
            test -s "$file" || { echo "::error::Required artifact missing: $file"; exit 1; }
          done
          sha256sum Clanarina-* LICENSE-COMMERCIAL.txt ANDROID-SIGNING-STATUS.txt > SHA256SUMS.txt
      - name: Create GitHub prerelease with every artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v0.2.$GITHUB_RUN_NUMBER-dev"
          printf '%s\n' 'DEVELOPMENT PRE-RELEASE: Not for real member or financial data.' 'See ANDROID-SIGNING-STATUS.txt; temporary Android keys are NOT Play production keys.' 'Windows binaries are not yet Authenticode signed.' 'Commercial EULA is a legal draft pending verification.' 'DEMO Setup and Portable have synthetic records, isolated database and no license-key prompt.' 'Pixel-perfect and full licensing integration remain unverified.' > release-notes.txt
          gh -R "$GITHUB_REPOSITORY" release create "$tag" release/* --target "$GITHUB_SHA" --title "Članarina $tag - APK AAB Portable Setup Source" --notes-file release-notes.txt --prerelease
